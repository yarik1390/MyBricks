name: Openverse photos

# Collects Creative Commons photos of sets from Openverse into D1
# (training_images) for the scan model. Runs here, not in the Worker:
# Openverse throttles shared Cloudflare Workers IPs, both token requests and
# searches, even with a valid token (2026-11-27/28). See
# scripts/openverse-photos.mjs.

on:
  schedule:
    - cron: "41 */3 * * *"   # 150 sets per run, ~1,200 searches a day
  workflow_dispatch:
    inputs:
      limit:
        description: "Sets to search this run (max 500)"
        required: false
        default: "150"

permissions:
  contents: read

concurrency:
  group: openverse-photos
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect Openverse photos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
          LIMIT: ${{ github.event.inputs.limit || '150' }}
        run: node scripts/openverse-photos.mjs
