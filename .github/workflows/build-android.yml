name: Build Android (.aab)

# Builds the Capacitor Android app on a plain ubuntu runner — no Android Studio
# needed. Produces the Play-ready SIGNED app bundle as a workflow artifact.
#
# One-time owner setup (see also store/CAPACITOR-PLAYSTORE.md):
#   1. Create the upload keystore locally (any machine with Java):
#        keytool -genkeypair -v -keystore upload.jks -alias upload \
#          -keyalg RSA -keysize 2048 -validity 10000
#      (Play App Signing re-signs for distribution — this is only the UPLOAD key,
#       but keep it safe: losing it means a reset request to Google.)
#   2. GitHub secrets:
#        ANDROID_KEYSTORE_BASE64   ← `base64 -w0 upload.jks`
#        ANDROID_KEYSTORE_PASSWORD ← the -storepass you chose
#        ANDROID_KEY_ALIAS         ← "upload" (or your alias)
#        ANDROID_KEY_PASSWORD      ← key password (often same as store password)
#   3. Dispatch this workflow (or just push a change under public/ or android/)
#      → signed bundle lands on the 'aab-delivery' branch and auto-uploads to
#      the Play INTERNAL track once GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is set.
#
# Without the keystore secrets the build still runs but produces an UNSIGNED
# bundle (marked in the artifact name) — Play will not accept it; useful only
# to prove the project compiles.
#
# NOTE: manual dispatch requires this file to exist on the DEFAULT branch.

on:
  push:
    branches: [main]
    # Auto-build a new signed bundle (+ Play upload once GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
    # is set) whenever the app payload changes: bundled web assets or native config.
    paths:
      - "public/**"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "Which runner to use"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
      build_type:
        description: "What to build"
        required: false
        default: "bundle"
        type: choice
        options: [bundle, apk-debug]

concurrency:
  group: build-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        # Full history: versionCode = git rev-list --count HEAD (see
        # android/app/build.gradle). A shallow clone (depth=1) would count 1 and
        # silently fall back to the build.gradle floor.
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install workspace deps (Capacitor CLI + platform)
        run: npm ci

      - name: Prepare bundled native configuration
        env:
          RC_PLAY_BILLING_KEY: ${{ secrets.RC_PLAY_BILLING_KEY }}
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${RC_PLAY_BILLING_KEY}" ]; then
            printf "\nwindow.RC_PLAY_BILLING_KEY = '%s';\n" "${RC_PLAY_BILLING_KEY}" >> public/env.js
          else
            echo "::warning::RC_PLAY_BILLING_KEY is missing; Play billing will be unavailable."
          fi
          if [ -n "${ANDROID_GOOGLE_SERVICES_JSON_BASE64}" ]; then
            printf '%s' "${ANDROID_GOOGLE_SERVICES_JSON_BASE64}" | base64 -d > android/app/google-services.json
          else
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON_BASE64 is missing; native push will be unavailable."
          fi

      - name: Refresh the bundled offline seed catalog
        # Regenerate public/data/seed-catalog.json from the live catalog so the
        # freshest top-sets snapshot is bundled into the app. Non-fatal: on any
        # failure the committed snapshot is kept, so a build never breaks here.
        run: node scripts/gen-seed-catalog.mjs || true

      - name: Sync web assets + plugins into the Android project
        run: npx cap sync android

      - name: Restore the upload keystore (if configured)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            # Sanitize common paste mistakes: an accidental "NAME=" prefix from
            # the secrets txt, and whitespace/newlines introduced by copying.
            VAL="${ANDROID_KEYSTORE_BASE64#ANDROID_KEYSTORE_BASE64=}"
            # Keep ONLY legal base64 characters — kills BOMs, non-breaking
            # spaces and other invisible junk that editors sneak into pastes.
            CLEAN="$(printf '%s' "$VAL" | tr -cd 'A-Za-z0-9+/=')"
            echo "Keystore secret: raw ${#VAL} chars, cleaned ${#CLEAN} chars (expected 2856; must be divisible by 4 — got mod $(( ${#CLEAN} % 4 )))."
            printf '%s' "$CLEAN" | base64 -d > android/upload.jks 2>/dev/null || {
              echo "::error::ANDROID_KEYSTORE_BASE64 does not decode — the value is truncated or wrong. Re-paste the full single-line value from the secrets file."; exit 1; }
            # JKS files start with magic bytes FE ED FE ED.
            MAGIC=$(head -c4 android/upload.jks | od -An -tx1 | tr -d ' \n')
            if [ "$MAGIC" != "feedfeed" ]; then
              echo "::error::Decoded keystore is not a JKS file (magic=$MAGIC) — the secret value is corrupted."; exit 1
            fi
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Keystore restored ($(stat -c%s android/upload.jks) bytes) — building a SIGNED bundle."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building UNSIGNED (compile check only; Play will reject it)."
          fi

      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ] && [ ! -s app/google-services.json ]; then
            echo "::error::A signed Play bundle requires ANDROID_GOOGLE_SERVICES_JSON_BASE64 so native push is functional."
            exit 1
          fi
          if [ "${{ inputs.build_type || 'bundle' }}" = "apk-debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew bundleRelease --no-daemon
          fi

      - name: Report version (versionCode = commit count, floored at 56)
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "commit count: $COUNT -> effective versionCode: $(( COUNT < 56 ? 56 : COUNT ))"
          grep -E 'versionName' android/app/build.gradle | sed 's/^ *//'

      - name: Verify signature (signed bundles only)
        if: steps.keystore.outputs.signed == 'true' && (inputs.build_type || 'bundle') != 'apk-debug'
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          echo "== jarsigner -verify =="
          "$JAVA_HOME/bin/jarsigner" -verify "$AAB" || { echo "::error::jar NOT verified"; exit 1; }
          echo "== signer certificate =="
          "$JAVA_HOME/bin/keytool" -printcert -jarfile "$AAB" | grep -iE 'Owner:|SHA1:|SHA-1:' || true

      - name: Publish signed bundle to delivery branch
        # The web session that dispatched this build can't pull workflow-artifact
        # binaries (needs the Claude GitHub App), but it CAN git-fetch. So mirror
        # the signed bundle + mapping to a throwaway, force-updated branch it can
        # fetch and attach. Safe to delete after pickup.
        if: steps.keystore.outputs.signed == 'true' && (inputs.build_type || 'bundle') != 'apk-debug'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          VER=$(grep versionName android/app/build.gradle | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          WORK=$(mktemp -d)
          cp "$AAB" "$WORK/BricksVault-${VER}-release.aab"
          if [ -f android/app/build/outputs/mapping/release/mapping.txt ]; then
            cp android/app/build/outputs/mapping/release/mapping.txt "$WORK/mapping.txt"
            gzip -kf "$WORK/mapping.txt"
          fi
          ( cd "$WORK"
            git init -q
            git config user.email "ci@bricksvault.app"
            git config user.name "BricksVault CI"
            git checkout -q -b aab-delivery
            git add -A
            git commit -qm "Deliver BricksVault ${VER} signed bundle (run ${GITHUB_RUN_ID})"
            git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" aab-delivery
          )
          echo "Pushed signed bundle to branch 'aab-delivery'."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bricksvault-${{ (inputs.build_type || 'bundle') == 'apk-debug' && 'debug-apk' || (steps.keystore.outputs.signed == 'true' && 'release-aab' || 'UNSIGNED-aab') }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 14

      - name: Check Play Console credentials
        id: play_creds
        # `secrets` is NOT a valid context in a step-level `if:` — using it there
        # makes GitHub reject the ENTIRE workflow at parse time (zero jobs, run
        # marked failed with no logs), which silently blocked every Android build.
        # Resolve the secret into a plain output here and branch on that instead.
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            # The action's `serviceAccountJson` input is a FILE PATH, not raw JSON —
            # passing the secret inline made it lstat a multi-KB "path" (ENAMETOOLONG).
            # Materialize the JSON into a temp file and hand the action that path.
            printf '%s' "$PLAY_JSON" > /tmp/play-sa.json
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON not set — skipping Play upload."
          fi

      - name: Upload to Google Play (Internal testing)
        # Auto-uploads the signed bundle to the Play Console internal track.
        # One-time setup (Play Console → Setup → API access): create a
        # service account with "Releases" access to the app, download its
        # JSON key, and save it as the GitHub secret
        # GOOGLE_PLAY_SERVICE_ACCOUNT_JSON. Without that secret this step
        # is skipped (the bundle is still delivered as an artifact + the
        # aab-delivery branch).
        # NOTE: the only release-producing choice is `bundle` (the input options
        # are bundle|apk-debug) — an earlier `== 'release'` here could never be
        # true, so this step would have stayed dead even after the parse fix.
        if: ${{ (inputs.build_type || 'bundle') == 'bundle' && steps.keystore.outputs.signed == 'true' && steps.play_creds.outputs.configured == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.bricksvault
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed
