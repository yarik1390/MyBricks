name: Benchmark Merge scan models

# Directly compares Merge-hosted vision models with the same resized production
# scan image and compact JSON prompt. Dispatch-only because it spends allowance.
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "LEGO set image"
        required: false
        default: "https://cdn.rebrickable.com/media/sets/75192-1.jpg"
      expected_set:
        description: "Expected base set number"
        required: false
        default: "75192"
      models:
        description: "Comma-separated Merge model ids"
        required: false
        default: "openai/gpt-4o-mini,openai/gpt-4o,google/gemini-3.6-flash,google/gemini-3.5-flash-lite,openai/gpt-5.6-luna"
      repetitions:
        description: "Calls per model"
        required: false
        default: "2"

concurrency:
  group: merge-scan-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build production-sized image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
        run: |
          set -euo pipefail
          curl -sSL --max-time 30 "${IMAGE_URL}" -o /tmp/set.jpg
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          if command -v convert >/dev/null; then
            convert /tmp/set.jpg -resize '1024x1024>' -quality 85 /tmp/set-small.jpg
          else
            cp /tmp/set.jpg /tmp/set-small.jpg
          fi
          base64 -w0 /tmp/set-small.jpg > /tmp/set.b64
          echo "image: $(stat -c%s /tmp/set-small.jpg) bytes"

      - name: Benchmark models
        env:
          MERGE_KEY: ${{ secrets.MERGE_GATEWAY_API_KEY }}
          MODELS: ${{ inputs.models }}
          EXPECTED_SET: ${{ inputs.expected_set }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          set -euo pipefail
          if [ -z "${MERGE_KEY}" ]; then
            echo "::error::MERGE_GATEWAY_API_KEY is required."; exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const image = fs.readFileSync('/tmp/set.b64', 'utf8').trim();
          const models = process.env.MODELS.split(',').map((m) => m.trim()).filter(Boolean);
          const repetitions = Math.max(1, Math.min(5, Number(process.env.REPETITIONS) || 1));
          const expected = String(process.env.EXPECTED_SET || '').replace(/-\d+$/, '');
          const prompt = `Identify the LEGO set in this image. Return ONLY compact JSON in this shape: {"sets":[{"set_number":"75192-1","name":"Millennium Falcon","theme":"Star Wars","year":2017,"confidence":0.99}],"minifigs":[]}. Use null when unknown. Do not guess.`;

          const run = async (model, repetition) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 10000);
            const started = Date.now();
            try {
              const response = await fetch('https://api-gateway.merge.dev/v1/openai/chat/completions', {
                method: 'POST', signal: controller.signal,
                headers: { authorization: `Bearer ${process.env.MERGE_KEY}`, 'content-type': 'application/json' },
                body: JSON.stringify({
                  model, max_tokens: 300, response_format: { type: 'json_object' },
                  messages: [{ role: 'user', content: [
                    { type: 'text', text: prompt },
                    { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${image}` } },
                  ] }],
                }),
              });
              const body = await response.json().catch(() => ({}));
              const content = String(body?.choices?.[0]?.message?.content ?? '');
              let setNumber = '';
              try {
                const parsed = JSON.parse(content.replace(/```json?\n?|```/g, '').trim());
                setNumber = String(parsed?.sets?.[0]?.set_number ?? '');
              } catch {}
              const base = setNumber.replace(/-\d+$/, '');
              const cost = Number(body?.usage?.cost);
              return {
                model, repetition, status: response.status, ms: Date.now() - started,
                identified: Boolean(setNumber), exact: Boolean(expected && base === expected),
                set_number: setNumber || null, cost_usd: Number.isFinite(cost) ? cost : null,
                error: response.ok ? null : String(body?.error?.message ?? 'provider error').slice(0, 120),
              };
            } catch (error) {
              return { model, repetition, status: 0, ms: Date.now() - started, identified: false, exact: false, set_number: null, cost_usd: null, error: error.name === 'AbortError' ? 'timeout' : String(error.message).slice(0, 120) };
            } finally { clearTimeout(timer); }
          };

          (async () => {
            const rows = [];
            for (const model of models) {
              for (let repetition = 1; repetition <= repetitions; repetition++) {
                const row = await run(model, repetition);
                rows.push(row);
                console.log(JSON.stringify(row));
              }
            }
            console.log('--- summary ---');
            for (const model of models) {
              const r = rows.filter((x) => x.model === model);
              const sorted = r.map((x) => x.ms).sort((a, b) => a - b);
              const avg = Math.round(r.reduce((a, x) => a + x.ms, 0) / r.length);
              const costs = r.map((x) => x.cost_usd).filter(Number.isFinite);
              console.log(JSON.stringify({ model, calls: r.length, exact: r.filter((x) => x.exact).length, identified: r.filter((x) => x.identified).length, avg_ms: avg, max_ms: sorted.at(-1), avg_cost_usd: costs.length ? costs.reduce((a, x) => a + x, 0) / costs.length : null }));
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
