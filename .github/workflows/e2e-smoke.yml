name: e2e-smoke
on:
  pull_request:
  push:
    branches: [claude/mybricks-lego-app-EdTPX]
  workflow_dispatch:

# Cancel a running smoke suite when a newer commit supersedes it, so a burst of
# pushes doesn't stack N parallel Playwright installs + browser downloads.
concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm i -D @playwright/test
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json', 'e2e/**') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke suite
        run: npx playwright test --config=e2e/playwright.config.mjs
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
