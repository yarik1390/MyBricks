apply plugin: 'com.android.application'

// A release workflow may provide an immutable code chosen by GitHub's monotonic
// run number. Local builds fall back to max(git count, floor). Keep the floor at
// or above the highest code already accepted by Play; unlike a raw commit count,
// it cannot regress after a squash/rebase or in a shallow/no-git checkout.
def derivedVersionCode = { ->
    def floor = 1140
    def provided = System.getenv('ANDROID_VERSION_CODE')
    if (provided) {
        def parsed = Integer.parseInt(provided)
        if (parsed < floor) throw new GradleException("ANDROID_VERSION_CODE must be >= ${floor}")
        return parsed
    }
    try {
        def out = providers.exec {
            workingDir = rootDir.parentFile
            commandLine 'git', 'rev-list', '--count', 'HEAD'
        }.standardOutput.asText.get().trim()
        return Math.max(floor, Integer.parseInt(out))
    } catch (Exception ignored) {
        return floor
    }
}()

android {
    namespace = "app.bricksvault"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.bricksvault"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // See derivedVersionCode above — do not reintroduce a hand-bumped literal.
        versionCode derivedVersionCode
        versionName "1.0.55"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing from environment (used by .github/workflows/build-android.yml):
    // the CI decodes ANDROID_KEYSTORE_BASE64 to android/upload.jks and exports the
    // three credential vars. Local builds without the env fall back to unsigned
    // (Android Studio's own signing dialog still works as usual).
    signingConfigs {
        if (System.getenv("ANDROID_KEYSTORE_PASSWORD")) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "../upload.jks")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // R8 shrink + obfuscate (Play "app optimisation" advisory). The
            // Capacitor bridge and plugins ship consumer keep rules; app-side
            // extras live in proguard-rules.pro. Keep mapping.txt from CI for
            // deobfuscated crash reports.
            minifyEnabled true
            shrinkResources true
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_PASSWORD")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// The native app serves public/ from the APK bundle. Copy web assets before
// every build, but do not run the full `cap sync` inside Gradle: that command
// mutates included plugin projects after Gradle has configured their task graph
// and can delete intermediates that parallel metadata checks still need.
tasks.register('capCopy') {
    doLast {
        def repoRoot = file('../../')
        exec {
            workingDir repoRoot
            def nodeExe = System.getenv("NODE_EXE") ?: "node"
            def capBin = new File(repoRoot, "node_modules/@capacitor/cli/bin/capacitor")
            commandLine nodeExe, capBin.absolutePath, "copy", "android"
        }
    }
}
preBuild.dependsOn capCopy

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
