name: Diagnostic - Bright Data async eBay

# Temporary. Exercises the async unlocker lane end to end: submit an eBay
# sold-search job, then poll the collect endpoint across the documented ~5min
# latency. Answers whether eBay yields to a longer server-side retry.
# Manual dispatch only. Delete once the question is answered.

on:
  workflow_dispatch:
    inputs:
      worker_url:
        required: false
        default: "https://brickvault-api.zhydenko.workers.dev"
      poll_minutes:
        description: "How long to poll for the result"
        required: false
        default: "10"
      collect_id:
        description: "Collect an EXISTING response_id instead of submitting a new job (results are retained 48h)"
        required: false
        default: ""

jobs:
  async-probe:
    runs-on: ubuntu-latest
    env:
      WORKER_URL: ${{ inputs.worker_url || 'https://brickvault-api.zhydenko.workers.dev' }}
      POLL_MINUTES: ${{ inputs.poll_minutes || '10' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mint admin token
        env:
          SUPABASE_JWT_SECRET_FOR_CI: ${{ secrets.SUPABASE_JWT_SECRET }}
          ADMIN_USER_ID_FOR_CI: ${{ secrets.ADMIN_USER_ID }}
        run: |
          set -euo pipefail
          ADMIN_JWT="$(node - <<'NODE'
          const crypto = require('crypto');
          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString('base64url');
          const unsigned = `${b64({ alg: 'HS256', typ: 'JWT' })}.${b64({
            sub: process.env.ADMIN_USER_ID_FOR_CI,
            role: 'authenticated',
            exp: Math.floor(Date.now() / 1000) + 60 * 60,
          })}`;
          const sig = crypto.createHmac('sha256', process.env.SUPABASE_JWT_SECRET_FOR_CI)
            .update(unsigned).digest('base64url');
          process.stdout.write(`${unsigned}.${sig}`);
          NODE
          )"
          echo "::add-mask::${ADMIN_JWT}"
          echo "ADMIN_JWT=${ADMIN_JWT}" >> "$GITHUB_ENV"

      - name: Reuse an existing job id
        if: ${{ inputs.collect_id != '' }}
        run: |
          set -euo pipefail
          echo "Collecting existing response_id ${{ inputs.collect_id }} (no new submit)."
          echo "SUBMIT_OK=true" >> "$GITHUB_ENV"
          echo "RESPONSE_ID=${{ inputs.collect_id }}" >> "$GITHUB_ENV"

      - name: Submit async job
        if: ${{ inputs.collect_id == '' }}
        run: |
          set -euo pipefail
          curl -s --max-time 60 -X POST "${WORKER_URL}/api/admin/brightdata-async" \
            -H "Authorization: Bearer ${ADMIN_JWT}" > /tmp/submit.json
          jq . /tmp/submit.json
          ID="$(jq -r '.response_id // empty' /tmp/submit.json)"
          if [ -z "${ID}" ]; then
            echo "::warning::Submit returned no response_id — see the error above."
            echo "::warning::If it says async is not enabled, flip Zone -> Advanced Options -> 'Asynchronous requests' in the Bright Data control panel."
            echo "SUBMIT_OK=false" >> "$GITHUB_ENV"
          else
            echo "SUBMIT_OK=true" >> "$GITHUB_ENV"
            echo "RESPONSE_ID=${ID}" >> "$GITHUB_ENV"
          fi

      - name: Poll for the result
        if: ${{ env.SUBMIT_OK == 'true' }}
        run: |
          set -euo pipefail
          DEADLINE=$(( $(date +%s) + POLL_MINUTES * 60 ))
          attempt=0
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            attempt=$((attempt + 1))
            curl -s --max-time 60 -X POST \
              "${WORKER_URL}/api/admin/brightdata-async?id=${RESPONSE_ID}" \
              -H "Authorization: Bearer ${ADMIN_JWT}" > /tmp/poll.json
            STATE="$(jq -r '.state // "unknown"' /tmp/poll.json)"
            echo "attempt ${attempt}: state=${STATE} ($(date -u +%H:%M:%S)Z)"
            if [ "${STATE}" = "ready" ]; then
              echo "=== RESULT ==="
              jq '{bytes, analyzed, body_head}' /tmp/poll.json
              exit 0
            fi
            if [ "${STATE}" = "error" ]; then
              echo "=== ERROR ==="
              jq . /tmp/poll.json
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Still pending after ${POLL_MINUTES} minutes."
          echo "Bright Data documents up to 8h at peak and retains results 48h, so"
          echo "response_id ${RESPONSE_ID} can still be collected later."
