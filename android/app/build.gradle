apply plugin: 'com.android.application'

android {
    namespace = "app.bricksvault"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.bricksvault"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Single source of truth for the native app version. Bump BOTH on every
        // Play upload: versionCode is monotonically increasing (Play rejects
        // duplicates); versionName is the user-visible string.
        versionCode 54
        versionName "1.0.53"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing from environment (used by .github/workflows/build-android.yml):
    // the CI decodes ANDROID_KEYSTORE_BASE64 to android/upload.jks and exports the
    // three credential vars. Local builds without the env fall back to unsigned
    // (Android Studio's own signing dialog still works as usual).
    signingConfigs {
        if (System.getenv("ANDROID_KEYSTORE_PASSWORD")) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "../upload.jks")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // R8 shrink + obfuscate (Play "app optimisation" advisory). The
            // Capacitor bridge and plugins ship consumer keep rules; app-side
            // extras live in proguard-rules.pro. Keep mapping.txt from CI for
            // deobfuscated crash reports.
            minifyEnabled true
            shrinkResources true
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_PASSWORD")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// The native app serves public/ from the APK bundle. A stale copy ships old JS
// silently — this once left the bundle a month behind main. Sync before every
// build so gradle can never package assets that don't match public/.
tasks.register('capSync') {
    doLast {
        // cap sync must run from the repo root (package.json + capacitor.config.json
        // live there), and gradle's exec env doesn't reliably carry the shell's
        // npx shim on Windows — so invoke node + the local CLI binary directly.
        def repoRoot = file('../../')
        exec {
            workingDir repoRoot
            def nodeExe = System.getenv("NODE_EXE") ?: "node"
            def capBin = new File(repoRoot, "node_modules/@capacitor/cli/bin/capacitor")
            commandLine nodeExe, capBin.absolutePath, "sync", "android"
        }
    }
}
preBuild.dependsOn capSync

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
