name = "brickvault-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "brickvault"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "brickvault_events"

[[r2_buckets]]
binding = "PHOTO_BUCKET"
bucket_name = "brickvault-photos"

[triggers]
crons = [
  "0 * * * *",
  "0 2 * * *",
  "0 3 * * *",
  "0 8 * * *",
  "0 4 * * *",
  "0 5 * * *",
]

[vars]
# Non-secret vars go here
