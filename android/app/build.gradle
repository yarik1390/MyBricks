apply plugin: 'com.android.application'

// A release workflow may provide an immutable code chosen by GitHub's monotonic
// run number. Local builds fall back to max(git count, floor). Keep the floor at
// or above the highest code already accepted by Play; unlike a raw commit count,
// it cannot regress after a squash/rebase or in a shallow/no-git checkout.
def derivedVersionCode = { ->
    def floor = 1140
    def provided = System.getenv('ANDROID_VERSION_CODE')
    if (provided) {
        def parsed = Integer.parseInt(provided)
        if (parsed < floor) throw new GradleException("ANDROID_VERSION_CODE must be >= ${floor}")
        return parsed
    }
    try {
        def out = providers.exec {
            workingDir = rootDir.parentFile
            commandLine 'git', 'rev-list', '--count', 'HEAD'
        }.standardOutput.asText.get().trim()
        return Math.max(floor, Integer.parseInt(out))
    } catch (Exception ignored) {
        return floor
    }
}()

// versionName follows the web build (public/sw.js VERSION "v627" -> "1.0.627")
// so every Play release shows a new, readable version that matches the
// version the web app reports. CI may override with ANDROID_VERSION_NAME.
def derivedVersionName = { ->
    def provided = System.getenv('ANDROID_VERSION_NAME')
    if (provided) return provided.trim()
    def sw = new File(rootDir.parentFile, 'public/sw.js')
    if (sw.exists()) {
        def m = (sw.text =~ /const\s+VERSION\s*=\s*["']v(\d+)["']/)
        if (m.find()) return "1.0.${m.group(1)}"
    }
    throw new GradleException('Could not derive versionName from public/sw.js VERSION')
}()

android {
    namespace = "app.bricksvault"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.bricksvault"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // See derivedVersionCode above — do not reintroduce a hand-bumped literal.
        versionCode derivedVersionCode
        // See derivedVersionName above — do not reintroduce a hand-bumped literal.
        versionName derivedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing from environment (used by .github/workflows/build-android.yml):
    // the CI decodes ANDROID_KEYSTORE_BASE64 to android/upload.jks and exports the
    // three credential vars. Local builds without the env fall back to unsigned
    // (Android Studio's own signing dialog still works as usual).
    signingConfigs {
        if (System.getenv("ANDROID_KEYSTORE_PASSWORD")) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "../upload.jks")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    testOptions {
        // Robolectric tests read R.string / R.drawable (notification channel, icon).
        unitTests.includeAndroidResources = true
        // Robolectric instantiates every manifest receiver; RevenueCat's Amazon
        // IAP receiver ships class files without stackmap frames, which the
        // JDK 21 verifier refuses. Test JVM only.
        unitTests.all { jvmArgs '-XX:+UnlockDiagnosticVMOptions', '-XX:-BytecodeVerificationRemote' }
    }
    buildTypes {
        release {
            // R8 shrink + obfuscate (Play "app optimisation" advisory). The
            // Capacitor bridge and plugins ship consumer keep rules; app-side
            // extras live in proguard-rules.pro. Keep mapping.txt from CI for
            // deobfuscated crash reports.
            minifyEnabled true
            shrinkResources true
            // Play warns "contains native code, and you've not uploaded debug
            // symbols" on every bundle. All our .so files are prebuilt and
            // already stripped by their vendors (ML Kit barcode/OCR, CameraX,
            // AndroidX); even with an NDK, AGP finds no symbols to extract
            // (checked in PR #146). The warning is advisory and safe to ignore.
            // This stays so any future own/unstripped native code ships symbols.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // RevenueCat's Amazon store module ships a consumer rule file with
            // -dontoptimize, which switches R8 optimisation off for the WHOLE
            // app (Play: "DEX code optimisation 0%"). Ignore that file; its
            // other two rules (keep/dontwarn com.amazon.**) are restated in
            // proguard-rules.pro.
            optimization {
                keepRules {
                    ignoreFrom("com.revenuecat.purchases:purchases-store-amazon")
                }
            }
            if (System.getenv("ANDROID_KEYSTORE_PASSWORD")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// The native app serves public/ from the APK bundle. Copy web assets before
// every build, but do not run the full `cap sync` inside Gradle: that command
// mutates included plugin projects after Gradle has configured their task graph
// and can delete intermediates that parallel metadata checks still need.
tasks.register('capCopy') {
    doLast {
        def repoRoot = file('../../')
        exec {
            workingDir repoRoot
            def nodeExe = System.getenv("NODE_EXE") ?: "node"
            def capBin = new File(repoRoot, "node_modules/@capacitor/cli/bin/capacitor")
            commandLine nodeExe, capBin.absolutePath, "copy", "android"
        }
    }
}
preBuild.dependsOn capCopy

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.android.play:review:2.0.2'
    // Native Google sign-in sheet (GoogleIdSignInPlugin) via Credential Manager.
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // EdgeToEdge.enable (MainActivity) and the WebView version check (EdgeToEdgeInsets).
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // AlertMessagingService extends the push plugin's FirebaseMessagingService.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Local JVM tests for the native alert notifications (AlertMessagingServiceTest).
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
