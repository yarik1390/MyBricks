name: Deploy Brickvault

on:
  push:
    branches:
      - main
      - claude/mybricks-lego-app-EdTPX
    paths:
      - 'worker/**'
      - 'public/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

# Everything runs on GitHub's runner, which has open internet access to
# the Cloudflare and Supabase APIs (the dev sandbox does not). The runner
# creates the D1 database if needed, applies the schema, deploys the
# Worker + Pages, and uploads all Worker secrets.

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Create or find D1 database
        working-directory: worker
        run: |
          set -euo pipefail
          DB_ID="$(npx wrangler d1 list --json 2>/dev/null \
            | jq -r '.[] | select(.name=="brickvault") | .uuid' || true)"
          if [ -z "${DB_ID}" ] || [ "${DB_ID}" = "null" ]; then
            echo "Creating D1 database 'brickvault'..."
            CREATE_OUT="$(npx wrangler d1 create brickvault)"
            echo "${CREATE_OUT}"
            DB_ID="$(echo "${CREATE_OUT}" \
              | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
              | head -n1)"
          fi
          if [ -z "${DB_ID}" ]; then
            echo "ERROR: could not determine D1 database id" >&2
            exit 1
          fi
          echo "Using D1 database id: ${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "${GITHUB_ENV}"

      - name: Inject D1 database id into wrangler.toml
        working-directory: worker
        run: sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${DB_ID}/" wrangler.toml

      - name: Apply database schema
        working-directory: worker
        run: npx wrangler d1 execute brickvault --remote --file=schema.sql

      - name: Upload Worker secrets
        working-directory: worker
        run: |
          set -euo pipefail
          put() { printf '%s' "$2" | npx wrangler secret put "$1"; }
          put OPENAI_API_KEY            "${{ secrets.OPENAI_API_KEY }}"
          put REBRICKABLE_API_KEY       "${{ secrets.REBRICKABLE_API_KEY }}"
          put SUPABASE_URL              "${{ secrets.SUPABASE_URL }}"
          put SUPABASE_ANON_KEY         "${{ secrets.SUPABASE_ANON_KEY }}"
          put SUPABASE_SERVICE_ROLE_KEY "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          put ADMIN_USER_ID             "${{ secrets.ADMIN_USER_ID }}"

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy

      - name: Deploy Pages
        run: |
          npx wrangler pages deploy public \
            --project-name brickvault \
            --branch main \
            --commit-dirty=true
