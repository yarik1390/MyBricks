name: Deploy Brickvault

on:
  push:
    branches:
      - main
      - claude/mybricks-lego-app-EdTPX
    paths:
      - 'worker/**'
      - 'public/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Create or find D1 database via REST API
        run: |
          set -euo pipefail

          # Look up existing database by name
          DB_ID=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=brickvault" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -r '.result[0].uuid // ""')

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Creating D1 database 'brickvault'..."
            DB_ID=$(curl -sf \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"brickvault"}' \
              | jq -r '.result.uuid')
          fi

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "ERROR: failed to get or create D1 database" >&2
            exit 1
          fi

          echo "D1 database id: ${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "$GITHUB_ENV"

      - name: Inject D1 database id into wrangler.toml
        working-directory: worker
        run: sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${DB_ID}/" wrangler.toml

      - name: Apply database schema
        working-directory: worker
        run: npx wrangler d1 execute brickvault --remote --file=schema.sql 2>&1

      - name: Upload Worker secrets
        working-directory: worker
        run: |
          set -euo pipefail
          put() { printf '%s' "$2" | npx wrangler secret put "$1"; }
          put OPENAI_API_KEY            "${{ secrets.OPENAI_API_KEY }}"
          put REBRICKABLE_API_KEY       "${{ secrets.REBRICKABLE_API_KEY }}"
          put SUPABASE_URL              "${{ secrets.SUPABASE_URL }}"
          put SUPABASE_ANON_KEY         "${{ secrets.SUPABASE_ANON_KEY }}"
          put SUPABASE_SERVICE_ROLE_KEY "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          put ADMIN_USER_ID             "${{ secrets.ADMIN_USER_ID }}"

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy

      - name: Inject Worker URL into Pages env
        run: |
          SUBDOMAIN=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -r '.result.subdomain')
          WORKER_URL="https://brickvault-api.${SUBDOMAIN}.workers.dev"
          echo "Worker URL: ${WORKER_URL}"
          printf "window.WORKER_BASE = '%s';\n" "${WORKER_URL}" > public/env.js

      - name: Deploy Pages
        working-directory: worker
        run: |
          npx wrangler pages project create brickvault --production-branch main 2>&1 || true
          npx wrangler pages deploy ../public \
            --project-name brickvault \
            --branch main \
            --commit-dirty=true

      - name: Seed LEGO catalog (Rebrickable import)
        run: |
          SUBDOMAIN=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -r '.result.subdomain')
          WORKER_URL="https://brickvault-api.${SUBDOMAIN}.workers.dev"
          echo "Triggering catalog import at ${WORKER_URL}/api/admin/import-rebrickable ..."
          STATUS=$(curl -s -o /tmp/seed.json -w "%{http_code}" \
            -X POST "${WORKER_URL}/api/admin/import-rebrickable" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_JWT }}" \
            -H "Content-Type: application/json" \
            -d '{"dataset":"all"}')
          echo "HTTP ${STATUS}"
          cat /tmp/seed.json
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "409" ]; then
            echo "Seed returned unexpected status ${STATUS} — check ADMIN_JWT secret" >&2
          fi
