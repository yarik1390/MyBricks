<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#F5F1E8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BricksVault">
<meta name="description" content="BricksVault — a premium brick portfolio tracker. AI-powered pricing, ROI tracking, camera scanning.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com 'wasm-unsafe-eval'; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' blob: https://brickvault-api.zhydenko.workers.dev https://cdn.rebrickable.com https://*.supabase.co https://www.ebay.com https://open.er-api.com https://huggingface.co https://*.huggingface.co https://hf.co https://*.hf.co https://cdn.jsdelivr.net https://generativelanguage.googleapis.com https://api.openai.com https://challenges.cloudflare.com;">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BricksVault">
<meta property="og:title" content="BricksVault — Portfolio Tracker">
<meta property="og:description" content="Track, value, and forecast your brick collection.">
<meta property="og:image" content="/icon-512.png">
<meta name="twitter:card" content="summary">
<script>
// Native App Lock privacy curtain. This executes before styles, preload hints,
// and the module boot graph so persisted portfolio content cannot paint while
// biometric capability is still being checked. The web/PWA path is unchanged.
try {
  if (window.Capacitor?.isNativePlatform?.() && localStorage.getItem('bv_app_lock') === '1') {
    document.documentElement.classList.add('app-lock-pending');
  }
} catch {}
</script>
<meta name="twitter:title" content="BricksVault — Portfolio Tracker">
<meta name="twitter:description" content="Track, value, and forecast your brick collection.">
<meta name="twitter:image" content="/icon-512.png">

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>BricksVault</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Warm the API + set-image origins so the first data/image fetch skips DNS+TLS. -->
<link rel="preconnect" href="https://brickvault-api.zhydenko.workers.dev" crossorigin>
<link rel="preconnect" href="https://cdn.rebrickable.com" crossorigin>
<link rel="preload" href="/app.css" as="style">
<link rel="preload" href="/js/app.js" as="script" crossorigin>
<!-- The boot graph is discovered one module at a time (app.js → utils.js →
     api.js → …), a request waterfall on cold loads. modulepreload the whole
     boot set so they fetch in parallel with app.js itself. -->
<link rel="modulepreload" href="/js/utils.js">
<link rel="modulepreload" href="/js/state.js">
<link rel="modulepreload" href="/js/api.js">
<link rel="modulepreload" href="/js/router.js">
<link rel="modulepreload" href="/js/icons.js">
<link rel="modulepreload" href="/js/theme.js">
<link rel="modulepreload" href="/js/lib/pure-core.js">
<link rel="modulepreload" href="/js/lib/morphdom.js">
<link rel="stylesheet" href="/app.css">
<!-- Only the ACTIVE skin is loaded — theme-init sets this href — instead of five
     render-blocking skin sheets. Placed AFTER app.css so its rules win the cascade. -->
<link rel="stylesheet" id="bvSkin">
<!-- Sets the saved theme + active skin pre-paint AND loads Google Fonts
     non-render-blocking. Runs after app.css so it can target #bvSkin; still
     synchronous in <head>, so the theme is applied before first paint (no flash).
     External file because the page CSP is script-src 'self'. -->
<script src="/theme-init.js"></script>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
</head>
<body>

<div id="navProgress"></div>
<a href="#main-content" class="skip-link">Skip to content</a>
<div id="offlineBanner" class="offline-banner" role="status" aria-live="polite">You're offline — showing cached data</div>

<div id="app">
  <main id="main-content" tabindex="-1">
    <div id="root">
      <div class="page">
        <div class="skel card mb-12" style="height:180px"></div>
        <div class="skel line" style="width:120px;margin-bottom:16px"></div>
        <div class="grid">
          <div class="skel card" style="height:160px"></div>
          <div class="skel card" style="height:160px"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Bottom nav -->
<nav id="nav" aria-label="Main navigation">
  <a href="#/" class="nav-tab" data-route="/" aria-label="Vault">
    <span class="nav-icon"></span>
    <span class="nav-label">Vault</span>
  </a>
  <a href="#/add" class="nav-tab" data-route="/add" aria-label="Catalog">
    <span class="nav-icon"></span>
    <span class="nav-label">Catalog</span>
  </a>
  <a href="#/pile" class="nav-tab scan-tab" data-route="/pile" aria-label="Scan">
    <div class="scan-orb"></div>
    <span class="nav-label">Scan</span>
  </a>
  <a href="#/minifigs" class="nav-tab" data-route="/minifigs" aria-label="Minifigs">
    <span class="nav-icon"></span>
    <span class="nav-label">Minifigs</span>
  </a>
  <div class="nav-spacer" aria-hidden="true"></div>
  <a href="#/kids/badges" class="nav-tab kids-only" data-route="/kids/badges" aria-label="Badges">
    <span class="nav-icon"></span>
    <span class="nav-label">Badges</span>
  </a>
  <a href="#/me" class="nav-tab" data-route="/me" aria-label="Profile">
    <span class="nav-icon"></span>
    <span class="nav-label">Me</span>
  </a>
</nav>

<div id="toast" role="alert" aria-live="assertive"></div>
<div id="sheetBackdrop" class="sheet-backdrop" aria-hidden="true"></div>
<div id="sheet" class="sheet" aria-hidden="true"></div>

<!-- Camera scan overlay (populated by app.js when opened) -->
<div id="scanOverlay" aria-modal="true" role="dialog" aria-label="Camera scanner"></div>

<!-- Floating Advisor FAB and Drawer -->
<button id="advisorFab" class="advisor-fab" aria-label="Ask AI Advisor" style="display:none;">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <path d="M12 2.6l1.9 4.7 4.7 1.9-4.7 1.9L12 15.8l-1.9-4.7L5.4 9.2l4.7-1.9L12 2.6zM19 14l.9 2 2 .9-2 .9-.9 2-.9-2-2-.9 2-.9.9-2zM6 15.5l.7 1.6 1.6.7-1.6.7L6 20.6l-.7-1.6-1.6-.7 1.6-.7.7-1.6z"/>
  </svg>
</button>
<div id="advisorDrawer" class="advisor-drawer"></div>

<script src="/env.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
