name = "brickvault-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "brickvault"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "brickvault_events"

[[r2_buckets]]
binding = "PHOTO_BUCKET"
bucket_name = "brickvault-photos"

# Workers FREE plan allows a maximum of 5 cron triggers per account. Declaring a
# 6th made every deploy's schedule sync fail with code 10072 ("exceeded the
# limit of 5 cron triggers"), which froze all triggers at their last good state.
# The standalone minifig cron ('0 5') was redundant anyway — the 04:00 daily
# maintenance already values minifigs via runValuateSets({ includeMinifigs: true }).
# If/when on Workers Paid, '0 5 * * *' can be re-added.
[triggers]
crons = [
  "0 * * * *",
  "0 2 * * *",
  "0 3 * * *",
  "0 8 * * *",
  "0 4 * * *",
]

[vars]
# Non-secret vars go here
