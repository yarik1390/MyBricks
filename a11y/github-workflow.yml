# Accessibility checks. The API integration cannot write
# .github/workflows/, so copy THIS file to .github/workflows/a11y.yml yourself
# (GitHub web UI "Add file", or a local commit). Serious and critical axe
# findings block the job; Lighthouse remains informational.
name: a11y
on:
  pull_request:
  workflow_dispatch:
jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: axe-core
        run: npx playwright test --config=a11y/playwright.config.mjs
      - name: Lighthouse accessibility (report-only)
        continue-on-error: true
        run: LHCI_NO_SANDBOX=1 npx --yes @lhci/cli@0.15.1 autorun --config=a11y/lighthouserc.cjs
      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: a11y/axe-report.json
          if-no-files-found: ignore
