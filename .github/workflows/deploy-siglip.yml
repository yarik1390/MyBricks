name: Deploy SigLIP service

# bricksvault-siglip: SigLIP image embeddings in a Cloudflare Container, used by
# brickvault-api photo scans (lib/siglip.ts) through the SIGLIP service binding.
# Wrangler builds the image from siglip/container/Dockerfile with the runner's
# Docker and pushes it to the Cloudflare registry.
on:
  push:
    branches:
      - main
    paths:
      - 'siglip/**'
      - '.github/workflows/deploy-siglip.yml'
  workflow_dispatch:

concurrency:
  group: bricksvault-siglip-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: siglip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx tsc -p .
      - name: Smoke-test the container image locally
        run: |
          set -euo pipefail
          docker build -t siglip-test container
          docker run -d --name siglip -p 8080:8080 siglip-test
          for i in $(seq 1 60); do
            if curl -sf localhost:8080/health >/dev/null; then break; fi
            sleep 2
          done
          curl -sf localhost:8080/health
          OUT=$(curl -sf -X POST localhost:8080/embed -H 'Content-Type: application/json' \
            --data '{"urls":["https://cdn.rebrickable.com/media/sets/75192-1.jpg"]}')
          echo "$OUT" | jq '{dims: (.vectors[0] | length), ms}'
          test "$(echo "$OUT" | jq '.vectors[0] | length')" = "768"
          docker rm -f siglip
      - name: Deploy
        run: |
          set -euo pipefail
          if ! npx wrangler deploy > "$RUNNER_TEMP/deploy.log" 2>&1; then
            echo '::error::wrangler deploy failed (the API token may need Containers / Cloudchamber permission):'
            grep -vE '^[[:space:]]*$' "$RUNNER_TEMP/deploy.log" | grep -viE 'token|bearer' | tail -40
            exit 1
          fi
          grep -vE '^[[:space:]]*$' "$RUNNER_TEMP/deploy.log" | grep -viE 'token|bearer' | tail -15
