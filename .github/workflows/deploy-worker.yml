name: Deploy Brickvault

on:
  push:
    branches:
      - main
      - claude/mybricks-lego-app-EdTPX
    paths:
      - 'worker/**'
      - 'public/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Create or find D1 database via REST API
        run: |
          set -euo pipefail
          DB_ID=$(curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=brickvault" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -r '.result[0].uuid // ""')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Creating D1 database 'brickvault'..."
            DB_ID=$(curl -sf \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"brickvault"}' \
              | jq -r '.result.uuid')
          fi
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "ERROR: failed to get or create D1 database" >&2; exit 1
          fi
          echo "D1 database id: ${DB_ID}"
          echo "DB_ID=${DB_ID}" >> "$GITHUB_ENV"

      - name: Inject D1 database id into wrangler.toml
        working-directory: worker
        run: sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${DB_ID}/" wrangler.toml

      - name: Apply database schema
        working-directory: worker
        run: npx wrangler d1 execute brickvault --remote --file=schema.sql 2>&1

      - name: Apply column migrations (idempotent — duplicate column errors are expected on re-deploys)
        working-directory: worker
        shell: bash
        run: |
          # D1/SQLite stops a SQL file on the first duplicate-column error.
          # Apply column additions one-by-one so older databases still receive
          # later fields while existing databases can safely ignore duplicates.
          statements=(
            "ALTER TABLE lego_sets ADD COLUMN upc TEXT"
            "ALTER TABLE lego_sets ADD COLUMN cached_at DATETIME"
            "ALTER TABLE lego_sets ADD COLUMN source TEXT"
            "ALTER TABLE lego_sets ADD COLUMN valuation_expires_at DATETIME"
            "ALTER TABLE lego_sets ADD COLUMN ebay_value REAL"
            "ALTER TABLE lego_sets ADD COLUMN ebay_cached_at TEXT"
            "ALTER TABLE lego_sets ADD COLUMN used_value REAL"
            "ALTER TABLE lego_sets ADD COLUMN bl_new_value REAL"
            "ALTER TABLE lego_sets ADD COLUMN bl_new_qty INTEGER"
            "ALTER TABLE lego_sets ADD COLUMN bl_used_qty INTEGER"
            "ALTER TABLE lego_sets ADD COLUMN retirement_risk_score INTEGER"
            "ALTER TABLE lego_sets ADD COLUMN retirement_risk_updated_at TEXT"
            "ALTER TABLE user_collection ADD COLUMN purchased_at DATE"
            "ALTER TABLE user_collection ADD COLUMN deleted_at DATETIME"
            "ALTER TABLE user_collection ADD COLUMN last_modified DATETIME"
            "ALTER TABLE user_collection ADD COLUMN storage_location TEXT"
            "ALTER TABLE user_collection ADD COLUMN acquisition_source TEXT"
            "ALTER TABLE user_collection ADD COLUMN is_complete INTEGER DEFAULT 1"
            "ALTER TABLE user_collection ADD COLUMN missing_pieces INTEGER DEFAULT 0"
            "ALTER TABLE user_collection ADD COLUMN spike_alerted_at TEXT"
            "ALTER TABLE user_prefs ADD COLUMN is_public INTEGER NOT NULL DEFAULT 0"
            "ALTER TABLE user_prefs ADD COLUMN expose_public_value INTEGER DEFAULT 1"
            "ALTER TABLE user_prefs ADD COLUMN google_refresh_token TEXT"
            "ALTER TABLE user_prefs ADD COLUMN google_spreadsheet_id TEXT"
            "ALTER TABLE wishlist_alerts ADD COLUMN alert_type TEXT NOT NULL DEFAULT 'drop'"
            "ALTER TABLE import_runs ADD COLUMN figs_loaded INTEGER"
            "ALTER TABLE minifigs ADD COLUMN series TEXT"
            "ALTER TABLE minifigs ADD COLUMN current_value REAL"
            "ALTER TABLE minifigs ADD COLUMN added_at DATETIME"
            "ALTER TABLE minifigs ADD COLUMN source TEXT"
          )
          for sql in "${statements[@]}"; do
            npx wrangler d1 execute brickvault --remote --command "$sql" 2>&1 || true
          done
          npx wrangler d1 execute brickvault --remote --file=schema_migrate.sql 2>&1 || true

      - name: Rebuild derived search index
        working-directory: worker
        run: npx wrangler d1 execute brickvault --remote --file=schema_search_index.sql 2>&1

      - name: Upload Worker secrets
        working-directory: worker
        run: |
          set -euo pipefail
          put() { printf '%s' "$2" | npx wrangler secret put "$1"; }
          put OPENAI_API_KEY            "${{ secrets.OPENAI_API_KEY }}"
          put REBRICKABLE_API_KEY       "${{ secrets.REBRICKABLE_API_KEY }}"
          put SUPABASE_URL              "${{ secrets.SUPABASE_URL }}"
          put SUPABASE_ANON_KEY         "${{ secrets.SUPABASE_ANON_KEY }}"
          put SUPABASE_JWT_SECRET       "${{ secrets.SUPABASE_JWT_SECRET }}"
          put ADMIN_USER_ID             "${{ secrets.ADMIN_USER_ID }}"
          [ -n "${{ secrets.BRICKSET_API_KEY }}" ]          && put BRICKSET_API_KEY          "${{ secrets.BRICKSET_API_KEY }}"          || true
          [ -n "${{ secrets.BRICKLINK_CONSUMER_KEY }}" ]   && put BRICKLINK_CONSUMER_KEY   "${{ secrets.BRICKLINK_CONSUMER_KEY }}"   || true
          [ -n "${{ secrets.BRICKLINK_CONSUMER_SECRET }}" ] && put BRICKLINK_CONSUMER_SECRET "${{ secrets.BRICKLINK_CONSUMER_SECRET }}" || true
          [ -n "${{ secrets.BRICKLINK_TOKEN }}" ]          && put BRICKLINK_TOKEN          "${{ secrets.BRICKLINK_TOKEN }}"          || true
          [ -n "${{ secrets.BRICKLINK_TOKEN_SECRET }}" ]   && put BRICKLINK_TOKEN_SECRET   "${{ secrets.BRICKLINK_TOKEN_SECRET }}"   || true
          [ -n "${{ secrets.BRICKOWL_API_KEY }}" ]          && put BRICKOWL_API_KEY          "${{ secrets.BRICKOWL_API_KEY }}"          || true
          [ -n "${{ secrets.EBAY_APP_ID }}" ]              && put EBAY_APP_ID              "${{ secrets.EBAY_APP_ID }}"              || true
          [ -n "${{ secrets.EBAY_CLIENT_SECRET }}" ]       && put EBAY_CLIENT_SECRET       "${{ secrets.EBAY_CLIENT_SECRET }}"       || true
          [ -n "${{ secrets.BRICKECONOMY_API_KEY }}" ]     && put BRICKECONOMY_API_KEY     "${{ secrets.BRICKECONOMY_API_KEY }}"     || true
          [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]         && put GOOGLE_CLIENT_ID         "${{ secrets.GOOGLE_CLIENT_ID }}"         || true
          [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]     && put GOOGLE_CLIENT_SECRET     "${{ secrets.GOOGLE_CLIENT_SECRET }}"     || true

      - name: Deploy Worker and capture URL
        working-directory: worker
        run: |
          set +e
          DEPLOY_OUT=$(npx wrangler deploy 2>&1)
          DEPLOY_EXIT=$?
          echo "$DEPLOY_OUT"
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "::error::wrangler deploy failed (exit $DEPLOY_EXIT)" >&2
            exit $DEPLOY_EXIT
          fi
          WORKER_URL=$(echo "$DEPLOY_OUT" | grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' | head -1)
          if [ -z "$WORKER_URL" ]; then
            # fallback: query the subdomain API
            SUBDOMAIN=$(curl -sf \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              | jq -r '.result.subdomain // ""')
            WORKER_URL="https://brickvault-api.${SUBDOMAIN}.workers.dev"
          fi
          echo "Worker URL: ${WORKER_URL}"
          echo "WORKER_URL=${WORKER_URL}" >> "$GITHUB_ENV"

      - name: Inject Worker URL into Pages env.js
        run: |
          echo "window.WORKER_BASE = '${WORKER_URL}';" > public/env.js
          echo "env.js: $(cat public/env.js)"

      - name: Deploy Pages
        working-directory: worker
        run: |
          npx wrangler pages project create brickvault --production-branch main 2>&1 || true
          npx wrangler pages deploy ../public \
            --project-name brickvault \
            --branch main \
            --commit-dirty=true

      - name: Public production smoke checks
        run: |
          set -euo pipefail
          curl -sf "${WORKER_URL}/api/config" | jq -e '.status.d1 == true' >/dev/null
          curl -sf "${WORKER_URL}/api/sets/search?q=Millennium&limit=1" | jq -e '.sets | length >= 0' >/dev/null

      - name: Protected production smoke checks
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.ADMIN_JWT }}" ]; then
            echo "::warning::ADMIN_JWT secret not set; skipping protected production smoke checks."
            exit 0
          fi
          curl -sf "${WORKER_URL}/api/admin/integrations" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_JWT }}" \
            | jq -e '.integrations | length > 0' >/dev/null
          curl -sf "${WORKER_URL}/api/admin/import-status" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_JWT }}" \
            | jq -e '.runs | type == "array"' >/dev/null

      - name: Seed LEGO catalog via Worker API
        run: |
          if [ -z "${{ secrets.ADMIN_JWT }}" ]; then
            echo "ADMIN_JWT secret not set — skipping seed. Run import manually from the Me tab."
            exit 0
          fi
          echo "Triggering catalog import at ${WORKER_URL} ..."
          STATUS=$(curl -s -o /tmp/seed.json -w "%{http_code}" \
            -X POST "${WORKER_URL}/api/admin/import-rebrickable" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_JWT }}" \
            -H "Content-Type: application/json" \
            -d '{"dataset":"all"}')
          echo "HTTP ${STATUS}"
          cat /tmp/seed.json
