name: D1 backup restore drill

# A backup that has never been restored is a hope, not a backup. Monthly (and
# on demand), this takes the NEWEST nightly dump from R2, restores it into a
# throwaway D1 database, validates the core tables actually came back, then
# deletes the scratch DB. Production (the `brickvault` database) is never
# touched — the drill DB name is guarded below.
#
# Fails loudly when: no dump exists, the dump doesn't import, or the restored
# catalog looks empty — i.e. exactly the cases where you'd WANT to find out
# now rather than during a real disaster.

on:
  schedule:
    - cron: "0 9 1 * *"   # 09:00 UTC on the 1st of each month (after the 08:00 backup)
  workflow_dispatch: {}

concurrency:
  group: brickvault-d1-recovery
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_BUCKET: brickvault-backups
      # Name is set per run after validating the generated suffix.
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Safety guard — the drill must never target production
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || {
            echo '::error::Invalid run identity for scratch DB'; exit 1;
          }

      - name: Find the newest dump in R2
        run: |
          set -euo pipefail
          # Follow every page; the newest key can be beyond the first 1000.
          cursor=''
          newest=''
          while :; do
            url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BACKUP_BUCKET}/objects?prefix=d1%2F&per_page=1000"
            if [ -n "$cursor" ]; then
              encoded=$(node -p 'encodeURIComponent(process.argv[1])' "$cursor")
              url="${url}&cursor=${encoded}"
            fi
            page=$(curl -fsS --retry 2 --max-time 30 "$url" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            jq -e '.success == true and (.result | type == "array")' <<< "$page" >/dev/null
            candidate=$(jq -r '[.result[].key | select(test("^d1/brickvault-[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{6}Z\\.sql\\.gz$"))] | sort | last // empty' <<< "$page")
            if [[ "$candidate" > "$newest" ]]; then newest="$candidate"; fi
            truncated=$(jq -r '.result_info.is_truncated // false' <<< "$page")
            if [ "$truncated" != true ]; then break; fi
            next=$(jq -r '.result_info.cursor // empty' <<< "$page")
            [ -n "$next" ] && [ "$next" != "$cursor" ] || { echo '::error::R2 pagination stalled'; exit 1; }
            cursor="$next"
          done
          [ -n "$newest" ] || { echo '::error::No valid backup dumps found'; exit 1; }
          echo "DUMP_KEY=${newest}" >> "$GITHUB_ENV"

      - name: Download and unpack the dump
        run: |
          set -euo pipefail
          npx wrangler@3 r2 object get "${BACKUP_BUCKET}/${DUMP_KEY}" --remote --file dump.sql.gz
          gunzip dump.sql.gz
          ls -lh dump.sql
          # An empty or tiny dump means the backup itself is broken.
          [ "$(stat -c%s dump.sql)" -gt 1000000 ] || { echo "::error::Dump is suspiciously small (<1MB)"; exit 1; }

      - name: Create the scratch database
        run: |
          set -euo pipefail
          # Unique name: never delete another live drill's DB. Cleanup is
          # limited to this run's own DB, even if creation/import fails.
          DRILL_DB="brickvault-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$DRILL_DB" =~ ^brickvault-restore-[0-9]+-[0-9]+$ ]] || exit 1
          npx wrangler@3 d1 create "${DRILL_DB}"
          echo "DRILL_DB=${DRILL_DB}" >> "$GITHUB_ENV"

      - name: Restore the dump into the scratch database
        run: |
          set -euo pipefail
          npx wrangler@3 d1 execute "${DRILL_DB}" --remote --file dump.sql --yes 2>&1 | tail -5

      - name: Validate the restored data
        run: |
          set -euo pipefail
          count() {
            npx wrangler@3 d1 execute "${DRILL_DB}" --remote --json \
              --command "SELECT COUNT(*) AS n FROM $1" \
              | jq -r '(if type == "array" then .[0] else . end).results[0].n'
          }
          SETS="$(count lego_sets)"
          PREFS="$(count user_prefs)"
          COLL="$(count user_collection)"
          SNAPS="$(count portfolio_snapshots)"
          echo "Restored: lego_sets=${SETS} user_prefs=${PREFS} user_collection=${COLL} portfolio_snapshots=${SNAPS}"
          # The catalog is the canary: a healthy dump carries tens of thousands
          # of sets. User tables just need to exist (fresh accounts may be few).
          if [ "${SETS}" -lt 10000 ]; then
            echo "::error::Restored catalog has only ${SETS} sets — the backup is not restorable/complete"; exit 1
          fi
          echo "✅ Restore drill passed — the newest backup is genuinely restorable."

      - name: Delete the scratch database
        if: always()
        run: |
          set -euo pipefail
          expected="brickvault-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$expected" =~ ^brickvault-restore-[0-9]+-[0-9]+$ ]]; then
            npx wrangler@3 d1 delete "$expected" -y
          fi
          rm -f -- dump.sql dump.sql.gz
