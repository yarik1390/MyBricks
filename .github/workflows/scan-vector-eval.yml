name: Scan image-index eval

# Dispatch-only. Measures how well catalog-image embeddings (Workers AI multimodal embedding
# model) identify real-world LEGO photos. Read-only: embeds through the Worker's
# admin-only /api/scan-vectors/embed (Workers AI), no D1 writes, no Vectorize. Test photos are listed by URL in
# scripts/scan-eval/test-photos.json (not stored in the repo).
on:
  workflow_dispatch:
    inputs:
      shape:
        description: "Model input shape (blank = probe in order)"
        required: false
        default: ""
      distractors:
        description: "Extra catalog sets embedded as distractors (0-30000)"
        required: false
        default: "3000"

permissions:
  contents: read

concurrency:
  group: scan-vector-eval
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Mint an admin token
        env:
          SUPABASE_JWT_SECRET_FOR_CI: ${{ secrets.SUPABASE_JWT_SECRET }}
          ADMIN_USER_ID_FOR_CI: ${{ secrets.ADMIN_USER_ID }}
        run: |
          set -euo pipefail
          ADMIN_JWT="$(node - <<'NODE'
          const crypto = require('crypto');
          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString('base64url');
          const unsigned = `${b64({ alg: 'HS256', typ: 'JWT' })}.${b64({
            sub: process.env.ADMIN_USER_ID_FOR_CI,
            role: 'authenticated',
            exp: Math.floor(Date.now() / 1000) + 5400,
          })}`;
          const sig = crypto.createHmac('sha256', process.env.SUPABASE_JWT_SECRET_FOR_CI)
            .update(unsigned).digest('base64url');
          process.stdout.write(`${unsigned}.${sig}`);
          NODE
          )"
          echo "::add-mask::${ADMIN_JWT}"
          echo "ADMIN_JWT=${ADMIN_JWT}" >> "$GITHUB_ENV"
      - name: Run
        env:
          SHAPE: ${{ inputs.shape }}
          DISTRACTORS: ${{ inputs.distractors || '3000' }}
        run: node scripts/scan-eval/eval.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-eval-report
          path: scan-eval-out/
          if-no-files-found: ignore
