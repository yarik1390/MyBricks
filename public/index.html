<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#F5F1E8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brickvault">
<meta name="description" content="Brickvault — a premium brick portfolio tracker. AI-powered pricing, ROI tracking, camera scanning.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://cdn.rebrickable.com https://*.supabase.co; frame-ancestors 'none';">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Brickvault">
<meta property="og:title" content="Brickvault — Portfolio Tracker">
<meta property="og:description" content="Track, value, and forecast your brick collection.">
<meta property="og:image" content="/icon.svg">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Brickvault — Portfolio Tracker">
<meta name="twitter:description" content="Track, value, and forecast your brick collection.">
<meta name="twitter:image" content="/icon.svg">

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Brickvault</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" href="/app.css" as="style">
<link rel="preload" href="/app.js" as="script" crossorigin>
<!-- Apply saved theme before the stylesheet to avoid a flash of the wrong theme. -->
<script src="/theme-init.js"></script>
<link rel="stylesheet" href="/app.css">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
</head>
<body>

<a href="#main-content" class="skip-link">Skip to content</a>
<div id="offlineBanner" class="offline-banner" role="status" aria-live="polite">You're offline — showing cached data</div>

<div id="app">
  <main id="main-content">
    <div id="root">
      <div class="page">
        <div class="skel card mb-12" style="height:180px"></div>
        <div class="skel line" style="width:120px;margin-bottom:16px"></div>
        <div class="grid">
          <div class="skel card" style="height:160px"></div>
          <div class="skel card" style="height:160px"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Bottom nav -->
<nav id="nav" aria-label="Main navigation">
  <a href="#/" class="nav-tab" data-route="/" aria-label="Vault">
    <span class="nav-icon"></span>
    <span class="nav-label">Vault</span>
  </a>
  <a href="#/add" class="nav-tab" data-route="/add" aria-label="Catalog">
    <span class="nav-icon"></span>
    <span class="nav-label">Catalog</span>
  </a>
  <a href="#/pile" class="nav-tab scan-tab" data-route="/pile" aria-label="Scan">
    <div class="scan-orb"></div>
    <span class="nav-label">Scan</span>
  </a>
  <a href="#/minifigs" class="nav-tab" data-route="/minifigs" aria-label="Minifigs">
    <span class="nav-icon"></span>
    <span class="nav-label">Figs</span>
  </a>
  <a href="#/me" class="nav-tab" data-route="/me" aria-label="Profile">
    <span class="nav-icon"></span>
    <span class="nav-label">Me</span>
  </a>
</nav>

<div id="ptrIndicator" class="ptr-indicator">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12a9 9 0 0115-6.7L21 8M21 4v4h-4M21 12a9 9 0 01-15 6.7L3 16M3 20v-4h4"/>
  </svg>
</div>
<div id="toast" role="alert" aria-live="assertive"></div>
<div id="sheetBackdrop" class="sheet-backdrop"></div>
<div id="sheet" class="sheet"></div>

<!-- Camera scan overlay (populated by app.js when opened) -->
<div id="scanOverlay" aria-modal="true" role="dialog" aria-label="Camera scanner"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
