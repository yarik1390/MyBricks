# Frontend smoke suite (Playwright). TEMPLATE — the GitHub App cannot push files
# under .github/workflows/, so copy this to .github/workflows/e2e-smoke.yml and
# commit it yourself. Hermetic: a zero-dep static server serves public/ and every
# /api/* call + Supabase auth is stubbed in-browser, so this needs no secrets and
# never touches the live Worker/Supabase (see e2e/README.md).
name: e2e-smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm i -D @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke suite
        run: npx playwright test --config=e2e/playwright.config.mjs
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
