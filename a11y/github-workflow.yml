# Accessibility checks (report-only). The API integration cannot write
# .github/workflows/, so copy THIS file to .github/workflows/a11y.yml yourself
# (GitHub web UI "Add file", or a local commit). It never blocks a PR while the
# axe/Lighthouse steps use continue-on-error. See a11y/README.md to enforce.
name: a11y
on:
  pull_request:
  workflow_dispatch:
jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install a11y tools
        run: npm i -D @playwright/test @axe-core/playwright @lhci/cli
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: axe-core (report-only)
        continue-on-error: true
        env:
          A11Y_BASE: https://brickvault-5ub.pages.dev
        run: npx playwright test --config=a11y/playwright.config.mjs
      - name: Lighthouse accessibility (report-only)
        continue-on-error: true
        run: npx lhci autorun --config=a11y/lighthouserc.json
      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: a11y/axe-report.json
          if-no-files-found: ignore
