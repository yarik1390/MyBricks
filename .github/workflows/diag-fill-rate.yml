name: Diagnostic - eBay fill rate

# Temporary. Measures eBay-sold coverage and A/B-tests the Firecrawl
# concurrency cap (5 -> 2) against the identical slice run before it landed
# (limit 20, which produced ok +15 / fail +15). Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: "Production Worker URL"
        required: false
        default: "https://brickvault-api.zhydenko.workers.dev"
      run_slice:
        description: "Also run a 20-set scrape slice (true/false)"
        required: false
        default: "true"

jobs:
  measure:
    runs-on: ubuntu-latest
    env:
      WORKER_URL: ${{ inputs.worker_url || 'https://brickvault-api.zhydenko.workers.dev' }}
      RUN_SLICE: ${{ inputs.run_slice || 'true' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mint admin token
        env:
          SUPABASE_JWT_SECRET_FOR_CI: ${{ secrets.SUPABASE_JWT_SECRET }}
          ADMIN_USER_ID_FOR_CI: ${{ secrets.ADMIN_USER_ID }}
        run: |
          set -euo pipefail
          ADMIN_JWT="$(node - <<'NODE'
          const crypto = require('crypto');
          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString('base64url');
          const unsigned = `${b64({ alg: 'HS256', typ: 'JWT' })}.${b64({
            sub: process.env.ADMIN_USER_ID_FOR_CI,
            role: 'authenticated',
            exp: Math.floor(Date.now() / 1000) + 30 * 60,
          })}`;
          const sig = crypto.createHmac('sha256', process.env.SUPABASE_JWT_SECRET_FOR_CI)
            .update(unsigned).digest('base64url');
          process.stdout.write(`${unsigned}.${sig}`);
          NODE
          )"
          echo "::add-mask::${ADMIN_JWT}"
          echo "ADMIN_JWT=${ADMIN_JWT}" >> "$GITHUB_ENV"

      - name: eBay-sold coverage + Firecrawl counters BEFORE
        run: |
          set -euo pipefail
          curl -sf "${WORKER_URL}/api/admin/integrations" -H "Authorization: Bearer ${ADMIN_JWT}" > /tmp/before.json
          echo "--- coverage (counts) ---"
          jq '.coverage | {total_sets, sets_with_ebay, sets_with_ebay_new, sets_with_ebay_used,
                           sets_with_bricklink_new, sets_with_bricklink_used}' /tmp/before.json
          echo "--- coverage (precomputed %) ---"
          jq '.coverage | {ebay_coverage_pct, ebay_new_coverage_pct, ebay_used_coverage_pct,
                           bricklink_new_coverage_pct, bricklink_used_coverage_pct}' /tmp/before.json
          echo "--- priceable lens (the honest denominator) ---"
          jq '.coverage.priceable' /tmp/before.json
          echo "--- firecrawl health counters ---"
          jq '.integrations[] | select(.service=="firecrawl") | {ok_count, fail_count, last_error}' /tmp/before.json
          jq '.firecrawl.pool | {keys_configured, keys_live, active_key_index, pooled_remaining}' /tmp/before.json

      - name: Run a 20-set slice at the new concurrency
        if: ${{ inputs.run_slice != 'false' }}
        run: |
          set -euo pipefail
          time curl -s --max-time 900 -X POST \
            "${WORKER_URL}/api/admin/jobs/ebay-sold-scrape?limit=20" \
            -H "Authorization: Bearer ${ADMIN_JWT}" | jq .

      - name: Firecrawl counters AFTER (the A/B)
        run: |
          set -euo pipefail
          curl -sf "${WORKER_URL}/api/admin/integrations" -H "Authorization: Bearer ${ADMIN_JWT}" > /tmp/after.json
          echo "--- firecrawl health counters ---"
          jq '.integrations[] | select(.service=="firecrawl") | {ok_count, fail_count, last_error}' /tmp/after.json
          echo "--- delta over the slice (previous run at concurrency 5 was ok +15 / fail +15) ---"
          jq -n --slurpfile b /tmp/before.json --slurpfile a /tmp/after.json '
            ($b[0].integrations[] | select(.service=="firecrawl")) as $bf
            | ($a[0].integrations[] | select(.service=="firecrawl")) as $af
            | { ok_delta: ($af.ok_count - $bf.ok_count),
                fail_delta: ($af.fail_count - $bf.fail_count) }'
          echo "--- coverage after ---"
          jq '.coverage | {sets_with_ebay_new, sets_with_ebay_used,
                           ebay_new_coverage_pct, ebay_used_coverage_pct}' /tmp/after.json
