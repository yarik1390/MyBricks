name: Diagnostic - eBay sold-scrape check

# Temporary, read-mostly diagnostic: mints its own short-lived admin JWT (same
# pattern as populate-production.yml) to run one ebay-sold-scrape job slice
# and print the admin integrations panel, so results are visible in the run
# log without needing a live admin bearer token pasted into chat. Manual
# dispatch only — never runs on push/schedule. Delete once no longer needed.

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: "Production Worker URL"
        required: false
        default: "https://brickvault-api.zhydenko.workers.dev"
      ebay_limit:
        description: "Sets to attempt in this ebay-sold-scrape slice"
        required: false
        default: "20"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WORKER_URL: ${{ inputs.worker_url || 'https://brickvault-api.zhydenko.workers.dev' }}
      EBAY_LIMIT: ${{ inputs.ebay_limit || '20' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mint admin token
        env:
          SUPABASE_JWT_SECRET_FOR_CI: ${{ secrets.SUPABASE_JWT_SECRET }}
          ADMIN_USER_ID_FOR_CI: ${{ secrets.ADMIN_USER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_JWT_SECRET_FOR_CI}" ] || [ -z "${ADMIN_USER_ID_FOR_CI}" ]; then
            echo "::error::SUPABASE_JWT_SECRET and ADMIN_USER_ID are required."
            exit 1
          fi
          ADMIN_JWT="$(node - <<'NODE'
          const crypto = require('crypto');
          const secret = process.env.SUPABASE_JWT_SECRET_FOR_CI;
          const sub = process.env.ADMIN_USER_ID_FOR_CI;
          const b64 = (obj) => Buffer.from(JSON.stringify(obj)).toString('base64url');
          const header = { alg: 'HS256', typ: 'JWT' };
          const payload = { sub, role: 'authenticated', exp: Math.floor(Date.now() / 1000) + 30 * 60 };
          const unsigned = `${b64(header)}.${b64(payload)}`;
          const sig = crypto.createHmac('sha256', secret).update(unsigned).digest('base64url');
          process.stdout.write(`${unsigned}.${sig}`);
          NODE
          )"
          echo "::add-mask::${ADMIN_JWT}"
          echo "ADMIN_JWT=${ADMIN_JWT}" >> "$GITHUB_ENV"

      - name: Integrations panel BEFORE
        run: |
          set -euo pipefail
          curl -sf "${WORKER_URL}/api/admin/integrations" -H "Authorization: Bearer ${ADMIN_JWT}" \
            | jq '.integrations[] | select(.service == "ebay" or .service == "brightdata" or .service == "firecrawl")'

      - name: Run one ebay-sold-scrape slice
        run: |
          set -euo pipefail
          curl -s -o /tmp/job.json -w 'HTTP %{http_code}\n' \
            -X POST "${WORKER_URL}/api/admin/jobs/ebay-sold-scrape?limit=${EBAY_LIMIT}" \
            -H "Authorization: Bearer ${ADMIN_JWT}"
          cat /tmp/job.json | jq .

      - name: Integrations panel AFTER
        run: |
          set -euo pipefail
          curl -sf "${WORKER_URL}/api/admin/integrations" -H "Authorization: Bearer ${ADMIN_JWT}" \
            | jq '.integrations[] | select(.service == "ebay" or .service == "brightdata" or .service == "firecrawl")'
